{% extends 'base.html' %}

{% block header %}
  <h1 class="h3 mb-0">{% block title %}Editar "{{ post.title }}"{% endblock %}</h1>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-8">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form method="post" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="title" class="form-label">Título</label>
            <input name="title" id="title" class="form-control"
                   value="{{ request.form['title'] or post.title }}" required>
          </div>
          <div class="mb-3">
            <label for="body" class="form-label">Conteúdo</label>
            <textarea name="body" id="body" class="form-control" rows="6">{{ request.form['body'] or post.body }}</textarea>
          </div>

          {% if post.imagem_post %}
            <div class="mb-3">
              <p class="form-label mb-1">Imagem atual</p>
              <img src="{{ url_for('static', filename='uploads/' ~ post.imagem_post) }}"
                   class="img-thumbnail post-thumb" alt="Imagem atual">
              <div class="form-check mt-2">
                <input class="form-check-input" type="checkbox" name="remover_imagem" id="remover_imagem" value="1">
                <label class="form-check-label" for="remover_imagem">Remover imagem</label>
              </div>
            </div>
          {% endif %}

          <div class="mb-4">
            <label for="imagem_post" class="form-label">
              {{ 'Trocar imagem' if post.imagem_post else 'Adicionar imagem' }}
              <span class="text-muted">(opcional)</span>
            </label>
            <input type="file" name="imagem_post" id="imagem_post" class="form-control"
                   accept=".png,.jpg,.jpeg,.gif,.webp">
          </div>

          <div class="d-flex gap-2 justify-content-end">
            <a href="{{ url_for('blog.index') }}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar</button>
          </div>
        </form>
      </div>
    </div>

    <form action="{{ url_for('blog.delete', id=post.id) }}" method="post" class="text-end mt-3">
      <button class="btn btn-outline-danger btn-sm" type="submit"
              onclick="return confirm('Tem certeza que deseja excluir este post?');">
        <i class="bi bi-trash"></i> Excluir post
      </button>
    </form>
  </div>
</div>
{% endblock %}
