{% extends 'base.html' %}

{% block header %}
  <h1 class="h3 mb-0">{% block title %}Novo post{% endblock %}</h1>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-8">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form method="post" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="title" class="form-label">Título</label>
            <input name="title" id="title" class="form-control"
                   value="{{ request.form['title'] }}" required>
          </div>
          <div class="mb-3">
            <label for="body" class="form-label">Conteúdo</label>
            <textarea name="body" id="body" class="form-control" rows="6">{{ request.form['body'] }}</textarea>
          </div>
          <div class="mb-4">
            <label for="imagem_post" class="form-label">Imagem <span class="text-muted">(opcional)</span></label>
            <input type="file" name="imagem_post" id="imagem_post" class="form-control"
                   accept=".png,.jpg,.jpeg,.gif,.webp">
          </div>
          <div class="d-flex gap-2 justify-content-end">
            <a href="{{ url_for('blog.index') }}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> Publicar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
